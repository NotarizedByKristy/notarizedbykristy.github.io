<style>
/* ============================================================
   NAV — white bar, black type, pink stroke (NBK brand).
   Self-contained so it works on every page.
   ============================================================ */
nav{position:fixed;top:0;left:0;right:0;z-index:1000;background:#fff;border-bottom:1px solid #EFE4E6;box-shadow:0 2px 0 #E8A0B4;padding:0 6%;display:flex;align-items:center;justify-content:space-between;height:80px;font-family:'Outfit',sans-serif;-webkit-font-smoothing:antialiased}
nav *{box-sizing:border-box}
nav .nav-logo{display:flex;align-items:center;text-decoration:none}
nav .nav-logo-img{display:block;height:66px;width:auto;max-width:62vw}
@media(max-width:768px){nav .nav-logo-img{height:52px}}
nav .nav-links{display:flex;align-items:center;gap:30px;list-style:none;margin:0;padding:0}
nav .nav-links a{color:#1C1719;opacity:.72;text-decoration:none;font-size:12px;font-weight:500;letter-spacing:1.2px;text-transform:uppercase;transition:color .2s,opacity .2s}
nav .nav-links a:hover,nav .nav-links a.active{opacity:1;color:#B23A63}
nav .nav-cta{opacity:1!important;color:#fff!important;background:#1C1719!important;border:1px solid #1C1719!important;padding:9px 22px!important;font-weight:500!important;transition:all .2s!important}
nav .nav-cta:hover{background:#B23A63!important;border-color:#B23A63!important;color:#fff!important}
nav .hamburger{display:none;cursor:pointer;background:none;border:none;padding:4px}
nav .hamburger span{display:block;width:22px;height:1.5px;background:#1C1719;margin:5px 0;transition:transform .2s,opacity .2s}
nav .hamburger.is-open span:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
nav .hamburger.is-open span:nth-child(2){opacity:0}
nav .hamburger.is-open span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}
.mobile-menu{display:none;position:fixed;top:80px;left:0;right:0;background:#fff;padding:24px 6% 32px;z-index:999;border-bottom:2px solid #E8A0B4;font-family:'Outfit',sans-serif;max-height:calc(100vh - 80px);overflow-y:auto;box-shadow:0 12px 24px rgba(28,23,25,.08)}
.mobile-menu.open{display:block}
.mobile-menu a{display:block;color:#1C1719;text-decoration:none;font-size:14px;font-weight:400;padding:13px 0;border-bottom:1px solid #F3ECEE;letter-spacing:.3px}
.mobile-menu a:active,.mobile-menu a:hover{color:#B23A63}
@media(max-width:768px){nav .nav-links{display:none}nav .hamburger{display:block}}
</style>

<nav>
  <a href="/index.html" class="nav-logo">
    <img class="nav-logo-img" src="/nbk-logo.png" width="640" height="177" alt="Notarized By Kristy LLC">
  </a>
  <ul class="nav-links">
    <li><a href="/services.html">Services</a></li>
    <li><a href="/apostille.html">Apostille</a></li>
    <li><a href="/about.html">About</a></li>
    <li><a href="/faq.html">FAQ</a></li>
    <li><a href="/fee-reference.html">Fee Reference</a></li>
    <li><a href="/quote.html">Get a Quote</a></li>
    <li><a href="/contact.html">Contact</a></li>
    <li><a href="/book.html" class="nav-cta">Schedule</a></li>
  </ul>
  <button class="hamburger" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="mobileMenu">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="mobile-menu" id="mobileMenu">
  <a href="/services.html">Services</a>
  <a href="/apostille.html">Apostille</a>
  <a href="/apostille-university.html">University Apostille</a>
  <a href="/about.html">About</a>
  <a href="/faq.html">FAQ</a>
  <a href="/fee-reference.html">Fee Reference</a>
  <a href="/quote.html">Get a Quote</a>
  <a href="/contact.html">Contact</a>
  <a href="/book.html" style="color:#B23A63;color:var(--gold,#B23A63);font-weight:500;border-bottom:none;margin-top:8px">Schedule an Appointment &rarr;</a>
</div>

<script>
(function(){
  // Use addEventListener so this works even when injected via fetch().innerHTML
  const hamburger = document.querySelector('nav .hamburger');
  const menu = document.getElementById('mobileMenu');

  if(hamburger && menu){
    hamburger.addEventListener('click', function(e){
      e.preventDefault();
      e.stopPropagation();
      const isOpen = menu.classList.toggle('open');
      hamburger.classList.toggle('is-open', isOpen);
      hamburger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });

    // Close menu when a link is tapped
    menu.querySelectorAll('a').forEach(function(a){
      a.addEventListener('click', function(){
        menu.classList.remove('open');
        hamburger.classList.remove('is-open');
        hamburger.setAttribute('aria-expanded', 'false');
      });
    });

    // Close menu when tapping outside it
    document.addEventListener('click', function(e){
      if(menu.classList.contains('open') && !menu.contains(e.target) && !hamburger.contains(e.target)){
        menu.classList.remove('open');
        hamburger.classList.remove('is-open');
        hamburger.setAttribute('aria-expanded', 'false');
      }
    });

    // Close on Escape key
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape' && menu.classList.contains('open')){
        menu.classList.remove('open');
        hamburger.classList.remove('is-open');
        hamburger.setAttribute('aria-expanded', 'false');
      }
    });
  }

  // Highlight active nav link based on current page
  const path = window.location.pathname.split('/').pop() || 'index.html';
  document.querySelectorAll('.nav-links a:not(.nav-cta), .mobile-menu a').forEach(function(a){
    const href = a.getAttribute('href');
    if(href === '/' + path || href === path){
      a.classList.add('active');
    }
  });
})();
</script>
